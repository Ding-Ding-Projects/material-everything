name: Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      started: ${{ steps.timing.outputs.started }}
    steps:
      - uses: actions/checkout@v4

      - name: Record workflow start time
        id: timing
        shell: bash
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Create unique tag
        if: success()
        shell: pwsh
        run: |
          $tag = "v0.1.$(Get-Random -Maximum 99999)-$(Get-Date -Format yyyyMMddHHmmss)"
          echo "TAG=$tag" >> $env:GITHUB_ENV
          git config user.name "Claude Fable 5"
          git config user.email "noreply@anthropic.com"
          git tag $tag
          git push origin $tag

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: Material Everything ${{ env.TAG }}
          body: 'Unified C++ desktop app with every popular open-source app as a Material Design 3 module.'
          draft: false
          generate_release_notes: true

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
